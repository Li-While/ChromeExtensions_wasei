<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="../static/js/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" type="text/css" href="../static/css/popup.css">
    <script src="../static/js/jscolor.min.js"></script>
    <script src="../static/js/option.js"></script>
    <style>
        tbody {
            border: 1.2px solid black;
            border-radius: 15%;

        }

        table {
            border-collapse: collapse;
        }

        ::-webkit-scrollbar {
            z-index: 50;
            width: 10px;
            height: 3px;
        }

        ::-webkit-scrollbar-track {
            background-color: rgba(0, 0, 0, 0);
        }

        ::-webkit-scrollbar-thumb {
            -webkit-border-radius: 5px;
            -moz-border-radius: 5px;
            border-radius: 5px;
            background-color: rgba(0, 0, 0, 0.1);
            transition: all .2s;
            height: 20px;
            border: 1px solid rgba(0, 0, 0, 0.2);
        }

        :hover::-webkit-scrollbar-thumb {
            transition: all .2s;
        }

        ::-webkit-scrollbar-button {
            display: none;
        }

        ::-webkit-scrollbar-corner {
            display: none;
        }

        h2 {
            text-align: left;
        }

        h3 {
            padding-left: 20px;
        }

        select {
            background-color: rgb(179, 250, 253);
            color: black;
            border-width: 2px;
        }

        input {
            margin: 2px;
        }

        input[type="range"] {
            -webkit-appearance: none;
            overflow: hidden;
            width: 160px;
            height: 17px;
            outline: none;
            background: rgb(179, 250, 253);
            border: 1.2px solid black;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            position: relative;
            width: 10px;
            height: 10px;
            background: black;
            border-radius: 50%;
            transition: .2s;
        }

        input[type="range"]:active::-webkit-slider-thumb:before,

        input[type="range"]:active::-webkit-slider-thumb:after {
            top: 6px;
        }

        input[type="range"]:active::-webkit-slider-thumb {
            width: 16px;
            height: 16px;
        }

        input[type="range"]:active::-webkit-slider-thumb:after {
            left: 16px;
        }

        input[type=checkbox] {
            cursor: pointer;
            position: relative;
        }

        input[type=checkbox]::after {
            position: absolute;
            top: 0;
            background-color: rgb(179, 250, 253);
            color: rgb(179, 250, 253);
            width: 12px;
            height: 12px;
            display: inline-block;
            visibility: visible;
            padding-left: 0px;
            text-align: center;
            content: ' ';
            border-radius: 2px;
            box-sizing: border-box;
            border: 1.2px solid black;
        }

        input[type=checkbox]:checked::after {
            content: "";
            background-color: rgb(179, 250, 253);
            border-color: black;
            border-width: 1.2px;
        }

        input[type=checkbox]:checked::before {
            content: '';
            position: absolute;
            left: 4px;
            top: 1.3px;
            width: 3px;
            height: 7px;
            border: solid black;
            border-width: 0 1.2px 1.2px 0;
            transform: rotate(45deg);
            z-index: 1;
        }

        input[type=button] {
            background-color: rgb(179, 250, 253);

        }

        .footer {
            text-align: center;
            font-size: 10px;
            margin-bottom: 11px;
        }

        a {
            color: black;
            text-decoration: none;
            font-weight: 400;
        }
    </style>
</head>
